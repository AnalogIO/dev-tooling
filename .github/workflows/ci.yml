name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  makefile:
    name: make (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Help
        run: make help

      - name: Dry-run the commands that do not need the stack
        run: |
          make -n app
          make -n open-link
          make -n list-users
          make -n down
