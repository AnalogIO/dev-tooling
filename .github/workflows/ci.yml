name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m py_compile e2e.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI help
        run: python e2e.py --help

      - name: Resolve configuration
        run: python e2e.py config --no-color

      - name: Shellcheck launcher
        if: runner.os == 'Linux'
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi
          shellcheck e2e
