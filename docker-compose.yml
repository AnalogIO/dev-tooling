# Infrastructure for local development. The backend runs on the host so that
# `dotnet build` + restart stays fast. The Makefile supplies these values from
# its own variables (DB_PORT, DB_PASSWORD, MAILHOG_*); the defaults below keep
# `docker compose` / `podman compose` usable on their own.
# The Compose project name is the directory name (override with
# COMPOSE_PROJECT_NAME if you keep multiple checkouts on one machine).
services:
  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Your_password123}"
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - SQLCMD=$$(command -v /opt/mssql-tools18/bin/sqlcmd || command -v /opt/mssql-tools/bin/sqlcmd); $$SQLCMD -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" >/dev/null || exit 1
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    restart: unless-stopped

  mailhog:
    image: ${MAILHOG_IMAGE:-mailhog/mailhog:latest}
    ports:
      - "${MAILHOG_BIND:-127.0.0.1}:${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_BIND:-127.0.0.1}:${MAILHOG_HTTP_PORT:-8025}:8025"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:8025/api/v2/messages || exit 1
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  mssql-data:
